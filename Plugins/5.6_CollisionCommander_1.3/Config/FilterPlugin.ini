[FilterPlugin]
; Collision Commander — source distribution
;
; This plugin is distributed as source only (no precompiled binaries).
; The packager (build_all.bat) uses robocopy to copy only:
;   Config\, Resources\, Source\, CollisionCommander.uplugin
;
; This file exists to satisfy Epic's FilterPlugin.ini requirement.
; No additional custom distribution folders are included.
;
; The following dev-only items are excluded from packaging by the
; build script and are listed here for Epic's automated checker:
-CLAUDE.md
-TASKS.md
-DEVLOG.md
-FAB_SUBMISSION.md
-FAB_LISTING_DESCRIPTION.md
-CollisionCommander_Spec.docx
